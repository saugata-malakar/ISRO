[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralink-copilot"
version = "0.1.0"
description = "Air-Gapped Predictive Copilot for Secure MPLS Operations (Team ERROR 404)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - Hackathon Prototype" }
authors = [{ name = "Team ERROR 404" }]

# Core runtime deps. Pinned for reproducibility after air-gapping (see §6).
# Heavy / optional engines (llama.cpp, sentence-transformers, flask) live in
# [project.optional-dependencies] so the core pipeline installs + tests cleanly
# everywhere and degrades gracefully to fully-offline fallbacks.
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "PyYAML==6.0.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "networkx==3.3",
    "cryptography==43.0.1",
    "PyJWT==2.9.0",
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "APScheduler==3.10.4",
    "textual==0.79.0",
    "rich==13.8.1",
    "httpx==0.27.2",
]

[project.optional-dependencies]
# Real local LLM engine (requires a C++ toolchain to build).
llm = ["llama-cpp-python==0.3.1"]
# Optional FAISS vector store (code falls back to a numpy brute-force index).
faiss = ["faiss-cpu==1.8.0.post1"]
# Optional richer local embeddings (code falls back to a hashing/TF-IDF embedder).
embed = ["sentence-transformers==3.1.1"]
# Optional web dashboard (M8 stretch).
web = ["Flask==3.0.3", "Jinja2==3.1.4"]
# Dev tooling.
dev = ["pytest==8.3.3", "ruff==0.6.8", "mypy==1.11.2", "types-PyYAML"]

[project.scripts]
neuralink = "neuralink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuralink = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# E501: line length handled pragmatically. B008: FastAPI's Depends()-in-default
# is the idiomatic dependency-injection pattern.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["neuralink"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
